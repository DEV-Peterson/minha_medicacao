name: minha_medicacao
description: "Organizador local e offline de medicamentos, doses e estoque."
publish_to: 'none'

# Nome da versão + build (versionName/versionCode no Android). O build sobe a
# cada APK publicado; o Android só atualiza por cima com um build maior.
version: 1.8.0+10

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.3
  share_plus: ^13.3.0
  file_picker: ^12.0.0
  archive: ^4.0.9
  intl: 0.20.2
  uuid: ^4.6.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

# Geração dos ícones do launcher: dart run flutter_launcher_icons
# As fontes ficam em assets/icone/ e não são empacotadas no APK.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icone/ic_launcher.png"
  adaptive_icon_background: "#16675E"
  adaptive_icon_foreground: "assets/icone/ic_launcher_frente.png"
  adaptive_icon_monochrome: "assets/icone/ic_launcher_mono.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
